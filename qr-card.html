<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio QR — print or save</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            font-family: system-ui, -apple-system, sans-serif;
            background: #0a0e14;
            color: #e8eef6;
        }
        .card {
            text-align: center;
            max-width: 22rem;
        }
        h1 {
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #7cb8ff;
            margin: 0 0 1.25rem;
        }
        img {
            display: block;
            width: 280px;
            height: 280px;
            margin: 0 auto;
            padding: 12px;
            background: #fff;
            border-radius: 12px;
        }
        p.url {
            margin: 1.25rem 0 0;
            font-size: 1.05rem;
            font-weight: 600;
        }
        p.url a {
            color: #9dd8c4;
            text-decoration: none;
        }
        p.note {
            margin: 2rem 0 0;
            font-size: 0.8rem;
            color: #8a9aaf;
            line-height: 1.5;
        }
        @media print {
            body { background: #fff; color: #111; }
            h1 { color: #1a5080; }
            p.url a { color: #0a5c45; }
            p.note { color: #444; }
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Scan → portfolio</h1>
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=280x280&amp;data=https%3A%2F%2Fwww.bhaviss.com%2F" width="280" height="280" alt="QR code linking to bhaviss.com">
        <p class="url"><a href="https://www.bhaviss.com/">www.bhaviss.com</a></p>
        <p class="note">Open this file locally, print, or screenshot for cards and events. Not part of the live site.</p>
    </div>
</body>
</html>
